# Development stack for Centre Khulula.
#
# Start it with:  docker compose up -d
# Stop it with:   docker compose down
# Wipe the data:  docker compose down -v      (-v also deletes the volumes)
#
# The api and client services join this file at step 11, once there is code to run.

services:
  postgres:
    image: postgres:16-alpine
    container_name: khulula-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:container — the host port lets Prisma and Adminer reach the database
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A named volume, so the data survives `docker compose down`
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready returns 0 only once the server accepts connections.
      # Without this, the api would start before the database is ready.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: khulula-redis
    restart: unless-stopped
    # Redis has no password by default. We set one even in development, so that
    # the development setup matches production and the habit is never lost.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  adminer:
    image: adminer:latest
    container_name: khulula-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        # Waits for the healthcheck above to pass, not merely for the container to exist
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
