# Development stack for Centre Khulula.
#
# Start it with:  docker compose up -d
# Stop it with:   docker compose down
# Wipe the data:  docker compose down -v      (-v also deletes the volumes)
#
# The api and client services join this file at step 11, once there is code to run.

services:
  postgres:
    image: postgres:16-alpine
    container_name: khulula-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:container — the host port lets Prisma and Adminer reach the database
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A named volume, so the data survives `docker compose down`
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready returns 0 only once the server accepts connections.
      # Without this, the api would start before the database is ready.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: khulula-redis
    restart: unless-stopped
    # Redis has no password by default. We set one even in development, so that
    # the development setup matches production and the habit is never lost.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  adminer:
    image: adminer:latest
    container_name: khulula-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        # Waits for the healthcheck above to pass, not merely for the container to exist
        condition: service_healthy

  api:
    build: ./api
    container_name: khulula-api
    # No `restart` here, unlike postgres and redis: in development a crash is
    # usually a mistake in the code, and restarting in a loop hides the error.
    #
    # Inside this network a service is reached by its name, so the host is
    # `postgres` and `redis` here — not `localhost` as in api/.env, which is
    # what your machine uses when you run `npm run dev` outside Docker.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_APP: postgresql://khulula_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      # The source is shared with the container, so a saved file restarts the
      # server. node_modules is not shared: the container has its own Linux
      # build of it.
      - ./api/src:/app/src
      - ./api/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The /health route of routes.ts. wget is in the alpine image already.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build: ./client
    container_name: khulula-client
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    # Inside Compose the API is reached by its service name, not by localhost.
    environment:
      VITE_API_TARGET: http://api:3000
    volumes:
      - ./client/src:/app/src

volumes:
  postgres-data:
  redis-data:
