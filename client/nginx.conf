# nginx serves the built React files and forwards /api to the API container,
# so the browser still sees one single origin and there is still no CORS.
server {
    listen 80;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        # Without this the API logs nginx's address for every visitor, and the
        # rate limiter counts them all as one person.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        # A React address like /species exists only in the browser, so any URL
        # that matches no file falls back to index.html.
        try_files $uri /index.html;
    }
}
